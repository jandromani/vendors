<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="40" fill="#111111"/>
  <!-- grid lines -->
  <pattern id="g" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="180" height="180" rx="40" fill="url(#g)"/>
  <!-- connector triangle -->
  <line x1="68" y1="66" x2="112" y2="66" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
  <line x1="68" y1="66" x2="90" y2="120" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
  <line x1="112" y1="66" x2="90" y2="120" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
  <!-- Claude — orange -->
  <circle cx="68" cy="66" r="16" fill="#D97757"/>
  <circle cx="68" cy="66" r="16" fill="url(#pO)"/>
  <!-- ChatGPT — green -->
  <circle cx="112" cy="66" r="16" fill="#10A37F"/>
  <circle cx="112" cy="66" r="16" fill="url(#pG)"/>
  <!-- Gemini — blue -->
  <circle cx="90" cy="120" r="16" fill="#4285F4"/>
  <circle cx="90" cy="120" r="16" fill="url(#pB)"/>
  <defs>
    <radialGradient id="pO" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F0926B"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pG" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1FC898"/>
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6EA8FF"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
